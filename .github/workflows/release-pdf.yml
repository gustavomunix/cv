name: Release PDF

on:
  push:
    branches: [main]
    paths:
      - Gustavo_Muniz_CV.yaml
      - .github/workflows/release-pdf.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-pdf
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install RenderCV
        run: pip install "rendercv[full]==2.8"

      - name: Render
        run: rendercv render Gustavo_Muniz_CV.yaml --dont-generate-html --dont-generate-markdown

      - name: Ensure single page
        run: |
          if [ -e rendercv_output/Gustavo_Muniz_CV_2.png ]; then
            echo "::error::CV passou de uma página A4"
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="cv-$(date -u +%Y-%m-%d)-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" rendercv_output/Gustavo_Muniz_CV.pdf \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CV $(date -u +%d/%m/%Y)" \
            --notes "PDF gerado a partir de ${GITHUB_SHA::7}." \
            --latest
